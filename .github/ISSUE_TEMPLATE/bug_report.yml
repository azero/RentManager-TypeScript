name: Bug report
description: Report a reproducible SDK defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, API tokens, tenant data, customer data, or unredacted API responses.
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.18.0
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: typescript
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation
      description: Include relevant test output with sensitive values removed.
